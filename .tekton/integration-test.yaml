---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bootc-image-builder-smoke-test
spec:
  description: >-
    Smoke test for bootc-image-builder: verifies the built container image
    has correct metadata (labels, entrypoint) and runs the binary.
  params:
  - name: SNAPSHOT
    description: A list of container images that should undergo testing
    type: string
  results:
  - name: TEST_OUTPUT
    value: $(tasks.version-test.results.TEST_OUTPUT)
  tasks:
  - name: smoke-test
    timeout: 15m
    params:
    - name: SNAPSHOT
      value: $(params.SNAPSHOT)
    taskSpec:
      params:
      - name: SNAPSHOT
        type: string
      results:
      - name: TEST_OUTPUT
        description: Test result in Konflux JSON format
      - name: IMAGE_URL
        description: Container image URL extracted from SNAPSHOT
      volumes:
      - name: podinfo
        downwardAPI:
          items:
          - path: labels
            fieldRef:
              fieldPath: metadata.labels
      steps:
      - name: run-smoke-test
        image: registry.access.redhat.com/ubi9/ubi-minimal:latest
        computeResources:
          limits:
            memory: 512Mi
          requests:
            memory: 256Mi
        env:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        volumeMounts:
        - name: podinfo
          mountPath: /etc/podinfo
        script: |
          #!/usr/bin/env bash
          set -euo pipefail

          RESULT_FILE="$(results.TEST_OUTPUT.path)"
          IMAGE_URL_FILE="$(results.IMAGE_URL.path)"

          fail() {
              printf '{"result":"FAILURE","successes":0,"failures":1,"warnings":0,"timestamp":"%s","note":"%s"}' "$(date +%s)" "$1" > "$RESULT_FILE"
              exit 1
          }

          microdnf install -y jq skopeo

          COMPONENT=""
          if [[ -f /etc/podinfo/labels ]]; then
              COMPONENT=$(grep -oP '(?<=component=")[^"]+' /etc/podinfo/labels || echo "")
          fi

          if [[ -n "$COMPONENT" ]]; then
              IMAGE=$(echo "${SNAPSHOT}" | jq -r ".components[]|select(.name==\"$COMPONENT\")|.containerImage")
          else
              IMAGE=$(echo "${SNAPSHOT}" | jq -r '.components[0].containerImage')
          fi

          if [[ -z "$IMAGE" || "$IMAGE" == "null" ]]; then
              fail "Could not extract image URL from SNAPSHOT"
          fi

          echo "Testing image: $IMAGE"

          echo "=== Inspecting image metadata ==="
          if ! skopeo inspect --no-tags "docker://$IMAGE" > /tmp/inspect.json; then
              fail "skopeo inspect failed — image is not pullable"
          fi

          echo "=== Image labels ==="
          jq '.Labels' /tmp/inspect.json

          echo "=== Inspecting image config ==="
          if ! skopeo inspect --no-tags --config "docker://$IMAGE" > /tmp/config.json; then
              fail "skopeo inspect --config failed"
          fi

          echo "=== Entrypoint ==="
          jq '.config.Entrypoint' /tmp/config.json

          if ! jq -r '(.config.Entrypoint // [])[]' /tmp/config.json | grep -q bootc-image-builder; then
              fail "Entrypoint does not contain bootc-image-builder"
          fi

          echo "PASS: image metadata verified"
          printf '%s' "$IMAGE" > "$IMAGE_URL_FILE"
          printf '{"result":"SUCCESS","successes":1,"failures":0,"warnings":0,"timestamp":"%s","note":"image metadata verified"}' "$(date +%s)" > "$RESULT_FILE"
  - name: version-test
    runAfter:
    - smoke-test
    timeout: 5m
    params:
    - name: IMAGE
      value: $(tasks.smoke-test.results.IMAGE_URL)
    taskSpec:
      params:
      - name: IMAGE
        type: string
      results:
      - name: TEST_OUTPUT
        description: Test result in Konflux JSON format
      steps:
      - name: run-version-test
        image: $(params.IMAGE)
        computeResources:
          limits:
            memory: 512Mi
          requests:
            memory: 256Mi
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          RESULT_FILE="$(results.TEST_OUTPUT.path)"
          echo "=== bootc-image-builder version ==="
          if ! bootc-image-builder --version; then
              printf '{"result":"FAILURE","successes":0,"failures":1,"warnings":0,"timestamp":"%s","note":"bootc-image-builder --version failed"}' "$(date +%s)" > "$RESULT_FILE"
              exit 1
          fi
          printf '{"result":"SUCCESS","successes":1,"failures":0,"warnings":0,"timestamp":"%s","note":"bootc-image-builder runs successfully"}' "$(date +%s)" > "$RESULT_FILE"
